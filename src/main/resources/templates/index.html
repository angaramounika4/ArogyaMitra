<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArogyaMitra - Healthy Families</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="position-relative">

    <!-- Screen-Wide Image Layer with Dynamic Blend -->
    <div class="hero-bg-layer" th:style="'background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.75) 0%, rgba(11, 19, 43, 0.35) 60%, rgba(11, 19, 43, 0.15) 100%), url(' + @{/images/family.png} + ');'"></div>

    <!-- Animated Landing Content -->
    <section class="hero d-flex align-items-center min-vh-100 position-relative z-2 py-5">
        <div class="container">
            <div class="row align-items-center">
                
                <div class="col-lg-8 text-white">
                    <div class="content-wrapper">
                        
                        <div class="animate-fade-in delay-1">
                            <span class="badge badge-glow px-3 py-2 rounded-pill mb-3">
                                <i class="fa-solid fa-heart-pulse me-1"></i> Family Health Companion
                            </span>
                        </div>
                        
                        <div class="animate-fade-in delay-2">
                            <h1 class="display-2 fw-bold text-glow mb-3">
                                ArogyaMitra
                            </h1>
                        </div>
                        
                        <div class="animate-fade-in delay-3">
                            <h3 class="fw-bold mb-4 text-warning text-drop-shadow">
                                Healthy Families. Happy Smiles. A Better Tomorrow.
                            </h3>
                        </div>
                        
                        <div class="animate-fade-in delay-4">
                            <p class="lead mb-4 lh-lg text-drop-shadow opacity-95">
                                Good health isn't just about treatment;<br>
                                it's about care, consistency,<br>
                                and the people we love.<br><br>
                                <strong>ArogyaMitra</strong> brings everything your family needs together in one trusted companion.
                            </p>
                        </div>
                        
                        <div class="d-grid d-sm-flex gap-3 mt-4 animate-fade-in delay-5">
                            <a th:href="@{/register}" href="/register" class="btn btn-glow btn-lg px-5 py-3 rounded-pill fw-bold">
                                Get Started <i class="fa-solid fa-arrow-right ms-2"></i>
                            </a>
                            <a th:href="@{/login}" href="/login" class="btn btn-glass btn-lg px-4 py-3 rounded-pill fw-semibold">
                                Login
                            </a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
