<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medical Records - ArogyaMitra</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="position-relative">

    <!-- Background Layer -->
    <div class="hero-bg-layer" style="background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.9) 0%, rgba(11, 19, 43, 0.7) 100%), url('/images/family.png');"></div>
    
    <!-- Navbar -->
    <nav class="navbar navbar-dark py-3 position-relative z-2">
        <div class="container">
            <a class="navbar-brand fw-bold text-glow fs-3" th:href="@{/dashboard}">
                <i class="fa-solid fa-heart-pulse text-info me-2"></i>ArogyaMitra
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-light rounded-pill btn-sm">
                <i class="fa-solid fa-house me-1"></i> Dashboard
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container position-relative z-2 py-4">
        <div class="row g-4">
            
            <!-- Upload Form Card -->
            <div class="col-md-5">
                <div class="glass-form-card p-4 rounded-4 border-glow">
                    <h3 class="text-white fw-bold mb-3">
                        <i class="fa-solid fa-file-arrow-up text-info me-2"></i>Upload Medical PDF
                    </h3>
                    
                    <form th:action="@{/records/upload}" method="post" enctype="multipart/form-data">
                        
                        <!-- Custom File Title (Important Requirement) -->
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Custom File Name / Description</label>
                            <input type="text" name="recordTitle" class="form-control glass-input text-white" placeholder="e.g., Blood Test Report - April 2026" required>
                        </div>

                        <!-- Member Name -->
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Family Member Name</label>
                            <input type="text" name="memberName" class="form-control glass-input text-white" placeholder="e.g., Durga" required>
                        </div>

                        <!-- PDF Upload Input -->
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Select PDF File</label>
                            <input type="file" name="file" accept="application/pdf" class="form-control glass-input text-white" required>
                        </div>

                        <button type="submit" class="btn btn-glow rounded-pill w-100 fw-bold py-2 mt-2">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload Record
                        </button>
                    </form>
                </div>
            </div>

            <!-- Uploaded Records List -->
            <div class="col-md-7">
                <div class="glass-form-card p-4 rounded-4 border-glow">
                    <h3 class="text-white fw-bold mb-3">
                        <i class="fa-solid fa-folder-open text-primary me-2"></i>Saved Medical Reports
                    </h3>
                    
                    <div th:if="${#lists.isEmpty(records)}" class="text-light opacity-75">
                        No medical records uploaded yet. Upload your first PDF report!
                    </div>

                    <div class="row g-3" th:if="${!#lists.isEmpty(records)}">
                        <div class="col-12" th:each="r : ${records}">
                            <div class="p-3 rounded-3 bg-white bg-opacity-10 text-white border border-secondary d-flex justify-content-between align-items-center">
                                
                                <div>
                                    <!-- Custom File Name displayed in BOLD -->
                                    <h5 class="mb-1 text-warning fw-bold fs-5" th:text="${r.recordTitle}">Blood Test Report</h5>
                                    
                                    <div class="small opacity-75">
                                        <i class="fa-solid fa-user me-1 text-info"></i> Member: <span class="fw-semibold text-white" th:text="${r.memberName}">Member</span> | 
                                        <i class="fa-solid fa-file-pdf me-1 text-danger"></i> PDF Document
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <!-- View PDF Button -->
                                    <a th:href="@{${r.filePath}}" target="_blank" class="btn btn-sm btn-outline-info rounded-pill px-3" title="View Document">
                                        <i class="fa-solid fa-eye me-1"></i> View
                                    </a>
                                    <!-- Delete Button -->
                                    <a th:href="@{/records/delete/{id}(id=${r.id})}" class="btn btn-sm btn-outline-danger rounded-circle" title="Delete Record">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
