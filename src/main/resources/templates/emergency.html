<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Emergency Contacts - ArogyaMitra</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .glass-select {
            background: rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glass-select option {
            background-color: #0b132b;
            color: white;
        }
    </style>
</head>
<body class="position-relative">

    <!-- Background Layer -->
    <div class="hero-bg-layer" style="background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.9) 0%, rgba(11, 19, 43, 0.7) 100%), url('/images/family.png');"></div>
    
    <!-- Navbar -->
    <nav class="navbar navbar-dark py-3 position-relative z-2">
        <div class="container">
            <a class="navbar-brand fw-bold text-glow fs-3" th:href="@{/dashboard}">
                <i class="fa-solid fa-heart-pulse text-info me-2"></i>ArogyaMitra
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-light rounded-pill btn-sm">
                <i class="fa-solid fa-house me-1"></i> Dashboard
            </a>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container position-relative z-2 py-4">
        <div class="row g-4">
            
            <!-- Left Side: Add Emergency Contact Form -->
            <div class="col-md-5">
                <div class="glass-form-card p-4 rounded-4 border-glow">
                    <h3 class="text-white fw-bold mb-3">
                        <i class="fa-solid fa-phone-volume text-danger me-2"></i>Add Emergency Contact
                    </h3>
                    
                    <form th:action="@{/emergency/save}" th:object="${newContact}" method="post">
                        
                        <!-- Contact Name -->
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Contact Name</label>
                            <input type="text" th:field="*{contactName}" class="form-control glass-input text-white" placeholder="e.g., Dr. Ramesh / Father" required>
                        </div>

                        <!-- Relation / Role -->
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Relationship / Role</label>
                            <select th:field="*{relation}" class="form-select glass-select text-white" required>
                                <option value="">Select Relation</option>
                                <option value="Family Doctor">Family Doctor</option>
                                <option value="Father">Father</option>
                                <option value="Mother">Mother</option>
                                <option value="Spouse">Spouse</option>
                                <option value="Brother/Sister">Brother / Sister</option>
                                <option value="Son/Daughter">Son / Daughter</option>
                                <option value="Neighbor/Friend">Neighbor / Friend</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- Phone Number -->
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Phone Number</label>
                            <input type="tel" th:field="*{phoneNumber}" class="form-control glass-input text-white" placeholder="e.g., 9876543210" pattern="[0-9]{10}" required>
                        </div>

                        <!-- Notes / Hospital details -->
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Additional Info (Optional)</label>
                            <input type="text" th:field="*{note}" class="form-control glass-input text-white" placeholder="e.g., Apollo Clinic / O+ Blood Group">
                        </div>

                        <button type="submit" class="btn btn-danger rounded-pill w-100 fw-bold py-2 mt-2">
                            <i class="fa-solid fa-user-plus me-2"></i>Save Emergency Contact
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Side: Emergency Contacts List -->
            <div class="col-md-7">
                <div class="glass-form-card p-4 rounded-4 border-glow">
                    <h3 class="text-white fw-bold mb-3">
                        <i class="fa-solid fa-address-book text-warning me-2"></i>Emergency Directory
                    </h3>
                    
                    <div th:if="${#lists.isEmpty(contacts)}" class="text-light opacity-75">
                        No emergency contacts added yet.
                    </div>

                    <div class="row g-3" th:if="${!#lists.isEmpty(contacts)}">
                        <div class="col-12" th:each="c : ${contacts}">
                            <div class="p-3 rounded-3 bg-white bg-opacity-10 text-white border border-secondary d-flex justify-content-between align-items-center">
                                
                                <div>
                                    <h5 class="mb-1 text-info fw-bold fs-5">
                                        <i class="fa-solid fa-user-doctor text-warning me-2" th:if="${c.relation == 'Family Doctor'}"></i>
                                        <i class="fa-solid fa-user-gear text-success me-2" th:if="${c.relation != 'Family Doctor'}"></i>
                                        <span th:text="${c.contactName}">Dr. Ramesh</span>
                                        <span class="badge bg-danger ms-2 fs-6" th:text="${c.relation}">Family Doctor</span>
                                    </h5>
                                    
                                    <div class="small opacity-90 mb-1">
                                        <a th:href="'tel:' + ${c.phoneNumber}" class="btn btn-sm btn-success rounded-pill px-3 py-1 fw-bold text-white me-2">
                                            <i class="fa-solid fa-phone me-1"></i> Call: <span th:text="${c.phoneNumber}">9876543210</span>
                                        </a>
                                    </div>

                                    <div class="small opacity-75 mt-2" th:if="${c.note != null and !c.note.empty}">
                                        <i class="fa-solid fa-circle-info text-info me-1"></i>Note: <span th:text="${c.note}">Apollo Clinic</span>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-sm btn-outline-warning rounded-circle" data-bs-toggle="modal" th:data-bs-target="'#editContactModal-' + ${c.id}" title="Edit Contact">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>

                                    <a th:href="@{/emergency/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger rounded-circle" title="Delete Contact">
                                        <i class="fa-solid fa-trash"></i>
                                    </a>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Edit Contact Modals -->
    <div th:each="c : ${contacts}">
        <div class="modal fade" th:id="'editContactModal-' + ${c.id}" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content glass-form-card border-glow text-white" style="background-color: #0b132b; border: 1px solid rgba(255,255,255,0.2);">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title text-warning fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Emergency Contact</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/emergency/save}" method="post">
                        <div class="modal-body">
                            <input type="hidden" name="id" th:value="${c.id}" />

                            <div class="mb-3">
                                <label class="form-label text-white">Contact Name</label>
                                <input type="text" name="contactName" th:value="${c.contactName}" class="form-control glass-input text-white" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white">Relationship / Role</label>
                                <select name="relation" class="form-select glass-select text-white" required>
                                    <option value="Family Doctor" th:selected="${c.relation == 'Family Doctor'}">Family Doctor</option>
                                    <option value="Father" th:selected="${c.relation == 'Father'}">Father</option>
                                    <option value="Mother" th:selected="${c.relation == 'Mother'}">Mother</option>
                                    <option value="Spouse" th:selected="${c.relation == 'Spouse'}">Spouse</option>
                                    <option value="Brother/Sister" th:selected="${c.relation == 'Brother/Sister'}">Brother / Sister</option>
                                    <option value="Son/Daughter" th:selected="${c.relation == 'Son/Daughter'}">Son / Daughter</option>
                                    <option value="Neighbor/Friend" th:selected="${c.relation == 'Neighbor/Friend'}">Neighbor / Friend</option>
                                    <option value="Other" th:selected="${c.relation == 'Other'}">Other</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white">Phone Number</label>
                                <input type="tel" name="phoneNumber" th:value="${c.phoneNumber}" class="form-control glass-input text-white" pattern="[0-9]{10}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-white">Additional Info</label>
                                <input type="text" name="note" th:value="${c.note}" class="form-control glass-input text-white">
                            </div>
                        </div>
                        <div class="modal-footer border-secondary">
                            <button type="button" class="btn btn-outline-light rounded-pill btn-sm" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-warning rounded-pill btn-sm fw-bold px-3">Update Contact</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
