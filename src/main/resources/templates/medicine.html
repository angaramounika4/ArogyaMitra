<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ArogyaMitra - Medicine Reminders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: #0d131d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .arogya-card {
            background: rgba(18, 26, 43, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .form-control, .form-select {
            background-color: #1a2332 !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #ffffff !important;
            border-radius: 8px;
        }
        .form-control::placeholder {
            color: #6c757d;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
            border-color: #38b6ff !important;
        }
        .btn-arogya {
            background: linear-gradient(90deg, #38b6ff 0%, #0072ff 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            border-radius: 25px;
            padding: 10px;
        }
        .btn-arogya:hover {
            opacity: 0.9;
            color: #ffffff;
        }
        .btn-dashboard {
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #ffffff;
            border-radius: 20px;
            padding: 6px 18px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-dashboard:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    </style>
</head>
<body class="position-relative text-white min-vh-100">

    <div class="hero-bg-layer" style="background-image: linear-gradient(90deg, rgba(13, 19, 29, 0.92) 0%, rgba(13, 19, 29, 0.85) 100%), url('/images/family.png'); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-size: cover; background-position: center;"></div>

    <!-- TOP NAVBAR -->
    <div class="container-fluid px-4 py-3 d-flex justify-content-between align-items-center position-relative z-2">
        <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-heart-pulse text-info fs-3"></i>
            <h3 class="fw-bold mb-0 text-white">Arogya<span class="text-info">Mitra</span></h3>
        </div>
        <a th:href="@{/dashboard}" class="btn-dashboard">
            <i class="fa-solid fa-house me-1"></i> Dashboard
        </a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container py-4 position-relative z-2">
        <div class="row g-4">
            
            <!-- LEFT FORM CARD -->
            <div class="col-lg-5">
                <div class="arogya-card p-4">
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <i class="fa-solid fa-pills text-info fs-4"></i>
                        <h4 class="fw-bold mb-0" th:text="${newMedicine.id == null ? 'Add Medicine Reminder' : 'Edit Medicine Reminder'}">Add Medicine Reminder</h4>
                    </div>

                    <form th:action="@{/medicine/save}" th:object="${newMedicine}" method="post" id="medicineForm">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label text-light opacity-75 small fw-semibold">Patient Name</label>
                            <input type="text" th:field="*{patientName}" class="form-control" placeholder="Enter patient name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light opacity-75 small fw-semibold">Phone Number</label>
                            <input type="tel" th:field="*{patientPhone}" class="form-control" placeholder="+91 9876543210" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-light opacity-75 small fw-semibold">Medicine Name</label>
                            <input type="text" th:field="*{medicineName}" class="form-control" placeholder="e.g. Paracetamol" required>
                        </div>

                        <!-- Combined hidden time field -->
                        <input type="hidden" id="fullMedicineTime" th:field="*{medicineTime}" />

                        <div class="mb-3">
                            <label class="form-label text-light opacity-75 small fw-semibold">Medicine Time</label>
                            <div class="input-group">
                                <input type="time" id="timeInput" class="form-control" required>
                                <select id="ampmSelect" class="form-select text-info fw-bold" style="max-width: 90px;">
                                    <option value="AM">AM</option>
                                    <option value="PM">PM</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-light opacity-75 small fw-semibold">Dosage</label>
                            <input type="text" th:field="*{dosage}" class="form-control" placeholder="e.g. 1 Tablet / 5ml" required>
                        </div>

                        <button type="submit" class="btn btn-arogya w-100">
                            Save Medicine Reminder
                        </button>
                    </form>
                </div>
            </div>

            <!-- RIGHT LIST CARD -->
            <div class="col-lg-7">
                <div class="arogya-card p-4">
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <i class="fa-solid fa-list-check text-info fs-4"></i>
                        <h4 class="fw-bold mb-0">Scheduled Medicines List</h4>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle mb-0 border-0">
                            <thead>
                                <tr style="background-color: rgba(255, 255, 255, 0.05); color: #a0aec0;">
                                    <th class="border-0">#</th>
                                    <th class="border-0">Patient</th>
                                    <th class="border-0">Phone</th>
                                    <th class="border-0">Medicine</th>
                                    <th class="border-0">Time</th>
                                    <th class="border-0">Dosage</th>
                                    <th class="border-0 text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="medicine, stat : ${medicines}">
                                    <td th:text="${stat.count}">1</td>
                                    <td th:text="${medicine.patientName}" class="fw-semibold"></td>
                                    <td th:text="${medicine.patientPhone}" class="small text-light opacity-75"></td>
                                    <td th:text="${medicine.medicineName}" class="text-info fw-semibold"></td>
                                    <td th:text="${medicine.medicineTime}"></td>
                                    <td th:text="${medicine.dosage}"></td>
                                    <td class="text-center">
                                        <a th:href="@{/medicine/edit/{id}(id=${medicine.id})}" class="btn btn-sm btn-outline-info rounded-circle me-1" title="Edit">
                                            <i class="fa-solid fa-pen"></i>
                                        </a>
                                        <a th:href="@{/medicine/delete/{id}(id=${medicine.id})}" class="btn btn-sm btn-outline-danger rounded-circle" title="Delete">
                                            <i class="fa-solid fa-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(medicines)}">
                                    <td colspan="7" class="text-center text-muted py-4">
                                        No medicine reminders added yet. Add a new reminder using the form!
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('medicineForm').addEventListener('submit', function(e) {
            const timeVal = document.getElementById('timeInput').value;
            const ampmVal = document.getElementById('ampmSelect').value;
            if (timeVal) {
                document.getElementById('fullMedicineTime').value = timeVal + ' ' + ampmVal;
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const existingTime = document.getElementById('fullMedicineTime').value;
            if (existingTime) {
                const parts = existingTime.split(' ');
                if (parts[0]) document.getElementById('timeInput').value = parts[0];
                if (parts[1]) document.getElementById('ampmSelect').value = parts[1];
            }
        });
    </script>
</body>
</html>
