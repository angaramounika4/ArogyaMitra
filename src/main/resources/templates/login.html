<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ArogyaMitra</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="position-relative">

    <!-- Matching Full-Screen Background Image Layer -->
    <div class="hero-bg-layer" th:style="'background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.85) 0%, rgba(11, 19, 43, 0.55) 60%, rgba(11, 19, 43, 0.3) 100%), url(' + @{/images/family.png} + ');'"></div>

    <!-- Main Login Section -->
    <section class="hero d-flex align-items-center justify-content-center min-vh-100 position-relative z-2 py-5">
        <div class="container">
            <div class="row justify-content-center">
                
                <div class="col-md-8 col-lg-5">
                    <div class="glass-form-card p-4 p-md-5 rounded-4 border-glow animate-fade-in delay-1">
                        
                        <!-- Header Icon & Title -->
                        <div class="text-center mb-4">
                            <span class="badge badge-glow px-3 py-2 rounded-pill mb-3">
                                <i class="fa-solid fa-right-to-bracket me-1"></i> Welcome Back
                            </span>
                            <h2 class="display-6 fw-bold text-glow">Account Login</h2>
                            <p class="text-light opacity-75 small">Access your family health dashboard</p>
                        </div>

                        <!-- Display Error Message if login fails 
<div th:if="${message}" class="alert alert-danger text-center rounded-pill py-2 mb-3">
    <i class="fa-solid fa-circle-exclamation me-1"></i> <span th:text="${message}"></span>
</div>-->

<div th:if="${message}" class="alert alert-danger text-center mb-3">
    <span th:text="${message}"></span>
</div>
<form th:action="@{/login}" method="post">
    
    <!-- Email Field -->
    <div class="mb-3 animate-fade-in delay-2">
        <label for="email" class="form-label text-white fw-semibold">Email Address</label>
        <div class="input-group">
            <span class="input-group-text bg-transparent text-primary border-glass">
                <i class="fa-solid fa-envelope"></i>
            </span>
            <input type="email" id="email" name="email" class="form-control glass-input text-white" placeholder="name@example.com" required>
        </div>
    </div>

    <!-- Password Field with Toggle Eye Icon -->
    <div class="mb-4 animate-fade-in delay-3">
        <label for="password" class="form-label text-white fw-semibold">Password</label>
        <div class="input-group">
            <span class="input-group-text bg-transparent text-primary border-glass">
                <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" name="password" class="form-control glass-input text-white border-end-0" placeholder="Enter your password" required>
            <button class="btn border-glass bg-transparent text-light border-start-0" type="button" onclick="togglePasswordVisibility('password', 'toggleIcon')">
                <i class="fa-solid fa-eye-slash" id="toggleIcon"></i>
            </button>
        </div>
    </div>

    <!-- 🌟 LOGIN BUTTON (MISSING LINE ADDED HERE) 🌟 -->
    <div class="d-grid mb-3 animate-fade-in delay-4">
        <button type="submit" class="btn btn-glow btn-lg rounded-pill fw-bold py-3 text-white">
            Login <i class="fa-solid fa-arrow-right ms-2"></i>
        </button>
    </div>

</form>

                        <!-- Footer Redirect Link -->
                        <div class="text-center mt-4 animate-fade-in delay-5">
                            <p class="mb-0 text-light opacity-90 small">
                                Don't have an account? 
                                <a th:href="@{/register}" href="/register" class="text-info fw-bold text-decoration-none hover-underline">Create Account</a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </section>
<!-- Toggle Password Visibility Script -->
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</body>
</html>
