<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - Family Health Guardian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="position-relative">

    <div class="hero-bg-layer" th:style="'background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.90) 0%, rgba(11, 19, 43, 0.70) 60%, rgba(11, 19, 43, 0.4) 100%), url(' + @{/images/family.png} + ');'"></div>

    <nav class="navbar navbar-expand-lg navbar-dark position-relative z-2 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-glow fs-3" th:href="@{/dashboard}" href="/dashboard">
                <i class="fa-solid fa-heart-pulse me-2 text-info"></i>ArogyaMitra
            </a>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/dashboard}" href="/dashboard" class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 fw-semibold">
                    <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <section class="position-relative z-2 py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="glass-form-card p-4 p-md-5 rounded-4 border-glow animate-fade-in delay-1">
                        
                        <div class="text-center mb-4">
                            <span class="badge badge-glow px-3 py-2 rounded-pill mb-3">
                                <i class="fa-solid fa-user-pen me-1"></i> User Account
                            </span>
                            <h2 class="display-6 fw-bold text-glow">Profile Settings</h2>
                            <p class="text-light opacity-75 small">Update your profile or change password</p>
                        </div>

                        <!-- Messages -->
                        <div th:if="${successMessage}" class="alert alert-success text-center rounded-pill py-2 mb-3">
                            <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${successMessage}"></span>
                        </div>

                        <div th:if="${success}" class="alert alert-success text-center rounded-pill py-2 mb-3">
                            <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${success}"></span>
                        </div>

                        <div th:if="${error}" class="alert alert-danger text-center rounded-pill py-2 mb-3">
                            <i class="fa-solid fa-circle-exclamation me-1"></i> <span th:text="${error}"></span>
                        </div>

                        <!-- Profile Update Form -->
                        <form th:action="@{/profile/update}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label text-white fw-semibold">Email Address (Cannot be changed)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent text-primary border-glass">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control glass-input text-white-50" th:value="${user != null ? user.email : ''}" readonly>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="name" class="form-label text-white fw-semibold">User Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent text-primary border-glass">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" id="name" name="name" class="form-control glass-input text-white" placeholder="Enter Name">
                                </div>
                            </div>

                            <!-- Password Trigger Section -->
                            <div class="mb-4 p-3 rounded-3 bg-white bg-opacity-10 border border-secondary">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <h6 class="text-white mb-1"><i class="fa-solid fa-lock text-warning me-2"></i>Password</h6>
                                        <small class="text-light opacity-75">••••••••••••</small>
                                    </div>
                                    <button type="button" class="btn btn-sm btn-outline-warning rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                                        <i class="fa-solid fa-key me-1"></i> Change Password
                                    </button>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-glow btn-lg rounded-pill fw-bold py-3">
                                    Save Changes <i class="fa-solid fa-check ms-2"></i>
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Change Password Modal -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-form-card border-glow text-white" style="background-color: #0b132b; border: 1px solid rgba(255,255,255,0.2);">
                
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning fw-bold">
                        <i class="fa-solid fa-key me-2"></i>Change Password
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form th:action="@{/profile/change-password}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-white">Current Password</label>
                            <input type="password" name="currentPassword" class="form-control glass-input text-white" placeholder="Enter current password" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white">New Password</label>
                            <input type="password" name="newPassword" class="form-control glass-input text-white" placeholder="Enter new password" minlength="6" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-white">Confirm New Password</label>
                            <input type="password" name="confirmPassword" class="form-control glass-input text-white" placeholder="Confirm new password" minlength="6" required>
                        </div>
                    </div>
                    
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-light rounded-pill btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-warning text-dark rounded-pill btn-sm fw-bold px-3">Update Password</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
