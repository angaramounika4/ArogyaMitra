<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Family Members - ArogyaMitra</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="position-relative">

    <!-- Background Image Layer -->
    <div class="hero-bg-layer" style="background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.9) 0%, rgba(11, 19, 43, 0.7) 100%), url('/images/family.png');"></div>
    
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark py-3 position-relative z-2">
        <div class="container">
            <a class="navbar-brand fw-bold text-glow fs-3" th:href="@{/dashboard}">
                <i class="fa-solid fa-heart-pulse text-info me-2"></i>ArogyaMitra
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-light rounded-pill btn-sm">
                <i class="fa-solid fa-house me-1"></i> Dashboard
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container position-relative z-2 py-4">
        <div class="row g-4">
            
            <!-- Left Side: Form to Add Member -->
            <div class="col-md-5">
                <div class="glass-form-card p-4 rounded-4 border-glow">
                    <h3 class="text-white fw-bold mb-3">
                        <i class="fa-solid fa-user-plus text-info me-2"></i>Add Family Member
                    </h3>
                    <form th:action="@{/members/save}" th:object="${newMember}" method="post">
                        
                        <div class="mb-3">
                            <label class="text-white fw-semibold">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control glass-input text-white" placeholder="Enter member name" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="text-white fw-semibold">Age</label>
                                <input type="number" th:field="*{age}" class="form-control glass-input text-white" placeholder="25" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="text-white fw-semibold">Blood Group</label>
                                <input type="text" th:field="*{bloodGroup}" class="form-control glass-input text-white" placeholder="O+ / B+" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="text-white fw-semibold">Relation</label>
                            <input type="text" th:field="*{relation}" class="form-control glass-input text-white" placeholder="Father, Spouse, Child, etc." required>
                        </div>

                        <div class="mb-3">
                            <label class="text-white fw-semibold">Phone Number</label>
                            <input type="tel" th:field="*{phoneNumber}" class="form-control glass-input text-white" placeholder="+91 9876543210" required>
                        </div>

                        <div class="mb-3">
                            <label class="text-white fw-semibold">Address</label>
                            <textarea th:field="*{address}" class="form-control glass-input text-white" rows="2" placeholder="Enter residential address" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-glow rounded-pill w-100 fw-bold py-2">
                            Save Family Member
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Side: List of Family Members -->
            <div class="col-md-7">
                <div class="glass-form-card p-4 rounded-4 border-glow">
                    <h3 class="text-white fw-bold mb-3">
                        <i class="fa-solid fa-users text-primary me-2"></i>Family Profiles List
                    </h3>
                    
                    <div th:if="${#lists.isEmpty(members)}" class="text-light opacity-75">
                        No family profiles added yet. Add a new member using the form!
                    </div>
                    
                    <div class="row g-3" th:if="${!#lists.isEmpty(members)}">
                        <div class="col-12" th:each="m : ${members}">
                            <div class="p-3 rounded-3 bg-white bg-opacity-10 text-white border border-secondary">
                                
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 class="mb-0 text-info fw-bold" th:text="${m.name}">Member Name</h5>
                                    
                                    <div class="d-flex gap-2">
                                        <!-- Edit Button Trigger Modal -->
                                        <button type="button" class="btn btn-sm btn-outline-warning rounded-circle" data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${m.id}" title="Edit Member">
                                            <i class="fa-solid fa-pen-to-square"></i>
                                        </button>
                                        <!-- Delete Button -->
                                        <a th:href="@{/members/delete/{id}(id=${m.id})}" class="btn btn-sm btn-outline-danger rounded-circle" title="Delete Member">
                                            <i class="fa-solid fa-trash"></i>
                                        </a>
                                    </div>
                                </div>
                                
                                <div class="small opacity-90">
                                    <span class="me-3"><strong>Relation:</strong> <span th:text="${m.relation}"></span></span>
                                    <span class="me-3"><strong>Age:</strong> <span th:text="${m.age}"></span></span>
                                    <span class="me-3"><strong>Blood:</strong> <span class="badge bg-danger" th:text="${m.bloodGroup}"></span></span>
                                </div>

                                <hr class="my-2 border-secondary">

                                <div class="small opacity-90">
                                    <div class="mb-1"><i class="fa-solid fa-phone text-warning me-2"></i><strong>Phone:</strong> <span th:text="${m.phoneNumber}"></span></div>
                                    <div><i class="fa-solid fa-location-dot text-success me-2"></i><strong>Address:</strong> <span th:text="${m.address}"></span></div>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Modals Section Placed Outside for Proper Backdrop Z-Index -->
    <div th:each="m : ${members}">
        <div class="modal fade" th:id="'editModal-' + ${m.id}" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content glass-form-card border-glow text-white" style="background-color: #0b132b; border: 1px solid rgba(255,255,255,0.2);">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title text-warning fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>Edit Family Member</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/members/save}" method="post">
                        <div class="modal-body">
                            <!-- Hidden ID to update existing record -->
                            <input type="hidden" name="id" th:value="${m.id}" />

                            <div class="mb-3">
                                <label class="form-label text-white">Full Name</label>
                                <input type="text" name="name" th:value="${m.name}" class="form-control glass-input text-white" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label text-white">Age</label>
                                    <input type="number" name="age" th:value="${m.age}" class="form-control glass-input text-white" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label text-white">Blood Group</label>
                                    <input type="text" name="bloodGroup" th:value="${m.bloodGroup}" class="form-control glass-input text-white" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Relation</label>
                                <input type="text" name="relation" th:value="${m.relation}" class="form-control glass-input text-white" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Phone Number</label>
                                <input type="tel" name="phoneNumber" th:value="${m.phoneNumber}" class="form-control glass-input text-white" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Address</label>
                                <textarea name="address" th:text="${m.address}" class="form-control glass-input text-white" rows="2" required></textarea>
                            </div>
                        </div>
                        <div class="modal-footer border-secondary">
                            <button type="button" class="btn btn-outline-light rounded-pill btn-sm" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-warning rounded-pill btn-sm fw-bold px-3">Update Details</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
