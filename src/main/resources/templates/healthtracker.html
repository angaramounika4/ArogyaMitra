<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Tracker - Family Health Guardian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="position-relative text-white">

    <div class="hero-bg-layer" th:style="'background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.90) 0%, rgba(11, 19, 43, 0.70) 60%, rgba(11, 19, 43, 0.4) 100%), url(' + @{/images/family.png} + ');'"></div>

    <nav class="navbar navbar-expand-lg navbar-dark position-relative z-2 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" th:href="@{/dashboard}">
                <i class="fa-solid fa-heart-pulse me-2 text-info"></i>ArogyaMitra
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-light btn-sm rounded-pill px-3 py-2">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </nav>

    <section class="position-relative z-2 py-4">
        <div class="container">
            
            <h2 class="fw-bold mb-4"><i class="fa-solid fa-heart-pulse text-danger me-2"></i>Health Tracker</h2>

            <div class="glass-form-card p-4 rounded-4 mb-5 border-glow">
                <h4 class="fw-bold mb-3">Log New Health Vitals</h4>
                <form th:action="@{/healthtracker/save}" th:object="${healthTracker}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Member Name</label>
                        <input type="text" th:field="*{memberName}" class="form-control" placeholder="e.g. John" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Blood Pressure</label>
                        <input type="text" th:field="*{bloodPressure}" class="form-control" placeholder="120/80" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Sugar Level (mg/dL)</label>
                        <input type="text" th:field="*{sugarLevel}" class="form-control" placeholder="95" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Weight (kg)</label>
                        <input type="text" th:field="*{weight}" class="form-control" placeholder="65" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-danger w-100 fw-bold">Save Record</button>
                    </div>
                </form>
            </div>

            <div class="glass-form-card p-4 rounded-4 border-glow">
                <h4 class="fw-bold mb-3">Saved Health Records</h4>
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Log Date</th>
                                <th>Member Name</th>
                                <th>Blood Pressure</th>
                                <th>Sugar Level</th>
                                <th>Weight (kg)</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="record : ${healthTrackerList}">
                                <td th:text="${record.logDate != null ? record.logDate : 'N/A'}">N/A</td>
                                <td th:text="${record.memberName}">John</td>
                                <td th:text="${record.bloodPressure}">120/80</td>
                                <td th:text="${record.sugarLevel}">95</td>
                                <td th:text="${record.weight}">65</td>
                                <td class="text-center">
                                    <a th:href="@{/healthtracker/edit/{id}(id=${record.id})}" class="btn btn-sm btn-warning text-dark fw-bold me-2">
                                        <i class="fa-solid fa-pen-to-square me-1"></i> Edit
                                    </a>
                                    <a th:href="@{/healthtracker/delete/{id}(id=${record.id})}" 
                                       class="btn btn-sm btn-danger fw-bold"
                                       onclick="return confirm('Delete this record?');">
                                        <i class="fa-solid fa-trash me-1"></i> Delete
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(healthTrackerList)}">
                                <td colspan="6" class="text-center text-muted py-3">No health records found. Add one above!</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
