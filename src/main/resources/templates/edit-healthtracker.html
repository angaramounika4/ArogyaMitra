<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Health Record - Family Health Guardian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="position-relative text-white">

    <div class="hero-bg-layer" th:style="'background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.90) 0%, rgba(11, 19, 43, 0.70) 60%, rgba(11, 19, 43, 0.4) 100%), url(' + @{/images/family.png} + ');'"></div>

    <div class="container py-5 position-relative z-2">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-form-card p-4 p-md-5 rounded-4 border-glow">
                    <h3 class="fw-bold mb-4 text-center">
                        <i class="fa-solid fa-pen-to-square text-warning me-2"></i>Edit Health Record
                    </h3>

                    <form th:action="@{/healthtracker/update}" th:object="${healthTracker}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Member Name</label>
                            <input type="text" th:field="*{memberName}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Blood Pressure</label>
                            <input type="text" th:field="*{bloodPressure}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Sugar Level (mg/dL)</label>
                            <input type="text" th:field="*{sugarLevel}" class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Weight (kg)</label>
                            <input type="text" th:field="*{weight}" class="form-control" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">Update Record</button>
                            <a th:href="@{/healthtracker}" class="btn btn-outline-light w-100 fw-bold">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
