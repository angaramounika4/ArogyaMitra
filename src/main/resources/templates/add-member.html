<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Family Member - ArogyaMitra</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body class="position-relative">

    <!-- Background Image Layer -->
    <div class="hero-bg-layer" th:style="'background-image: linear-gradient(90deg, rgba(11, 19, 43, 0.90) 0%, rgba(11, 19, 43, 0.70) 60%, rgba(11, 19, 43, 0.4) 100%), url(' + @{/images/family.png} + ');'"></div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark position-relative z-2 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold text-glow fs-3" th:href="@{/dashboard}" href="/dashboard">
                <i class="fa-solid fa-heart-pulse me-2 text-info"></i>ArogyaMitra
            </a>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/members}" href="/members" class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 fw-semibold">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Members
                </a>
            </div>
        </div>
    </nav>

    <!-- Form Section -->
    <section class="position-relative z-2 py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="glass-form-card p-4 p-md-5 rounded-4 border-glow animate-fade-in delay-1">
                        
                        <div class="text-center mb-4">
                            <span class="badge badge-glow px-3 py-2 rounded-pill mb-3">
                                <i class="fa-solid fa-user-plus me-1"></i> Member Registration
                            </span>
                            <h2 class="display-6 fw-bold text-glow">Add Family Member</h2>
                            <p class="text-light opacity-75 small">Enter health profile details of your family member</p>
                        </div>

                        <form th:action="@{/members/save}" th:object="${member}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            <!-- Name Field -->
                            <div class="mb-3">
                                <label for="name" class="form-label text-white fw-semibold">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent text-primary border-glass">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" id="name" th:field="*{name}" class="form-control glass-input text-white" placeholder="Enter Full Name" required>
                                </div>
                            </div>

                            <!-- Age & Gender Row -->
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label for="age" class="form-label text-white fw-semibold">Age</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-transparent text-primary border-glass">
                                            <i class="fa-solid fa-cake-candles"></i>
                                        </span>
                                        <input type="number" id="age" th:field="*{age}" class="form-control glass-input text-white" placeholder="Age" required>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <label for="gender" class="form-label text-white fw-semibold">Gender</label>
                                    <select id="gender" th:field="*{gender}" class="form-select glass-input text-white" required>
                                        <option value="" disabled selected class="bg-dark text-white">Select</option>
                                        <option value="Male" class="bg-dark text-white">Male</option>
                                        <option value="Female" class="bg-dark text-white">Female</option>
                                        <option value="Other" class="bg-dark text-white">Other</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Relation & Blood Group Row -->
                            <div class="row mb-4">
                                <div class="col-6">
                                    <label for="relation" class="form-label text-white fw-semibold">Relation</label>
                                    <input type="text" id="relation" th:field="*{relation}" class="form-control glass-input text-white" placeholder="e.g. Spouse, Son, Mother" required>
                                </div>
                                <div class="col-6">
                                    <label for="bloodGroup" class="form-label text-white fw-semibold">Blood Group</label>
                                    <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select glass-input text-white" required>
                                        <option value="" disabled selected class="bg-dark text-white">Select</option>
                                        <option value="A+" class="bg-dark text-white">A+</option>
                                        <option value="A-" class="bg-dark text-white">A-</option>
                                        <option value="B+" class="bg-dark text-white">B+</option>
                                        <option value="B-" class="bg-dark text-white">B-</option>
                                        <option value="O+" class="bg-dark text-white">O+</option>
                                        <option value="O-" class="bg-dark text-white">O-</option>
                                        <option value="AB+" class="bg-dark text-white">AB+</option>
                                        <option value="AB-" class="bg-dark text-white">AB-</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-glow btn-lg rounded-pill fw-bold py-3">
                                    Save Member <i class="fa-solid fa-check ms-2"></i>
                                </button>
                            </div>

                        </form>
                            
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
